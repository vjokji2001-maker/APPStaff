org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx2048m

android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Disable Kotlin incremental compilation to fix cross-drive (C: vs D:) path issues
kotlin.incremental=false
kotlin.compiler.incremental=false
# Disable Gradle build cache to avoid stale cache issues   
org.gradle.caching=false

# Network timeout configuration (aggressive settings for poor connectivity)
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.http.maxRetries=10

# Additional network settings for better resilience
systemProp.http.keepAlive=true
systemProp.http.maxConnections=5
systemProp.https.protocols=TLSv1.2

# Improve Gradle performance and reliability
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2

# Suppress compileSdk validation errors for dependencies compiled against older API levels
android.suppressUnsupportedCompileSdk=36
# Allow building with dependencies that have different compileSdk versions
android.allowUnsupportedDependencies=true
